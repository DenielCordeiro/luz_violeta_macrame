@if (authService.profile()) {
    <a mat-button routerLink="/profile" (click)="menuService.closeMenu('noAction')">
        <mat-icon class="material-symbols-outlined">account_circle</mat-icon>Minha conta
    </a>
} @else {
    <button mat-button type="button" (click)="loginDialog()">
        <mat-icon class="material-symbols-outlined">login</mat-icon>Entrar
    </button>
    @if (showRegister) {
        <a mat-button routerLink="/register" (click)="menuService.closeMenu('noAction')">Criar conta</a>
    }
}
