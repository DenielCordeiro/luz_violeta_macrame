<section id="buttons">
	@if (isConnected == true){
		<div class="button-login" (click)="loginDialog()">
			<span class="material-symbols-outlined">login</span> <br>
			<span>Entrar</span>
		</div>
	} @else {
		<div class="button-my-account" routerLink="/profile">
			<span class="material-symbols-outlined">account_circle</span> <br>
			<span>Minha Conta</span>
		</div>
	}
</section>
