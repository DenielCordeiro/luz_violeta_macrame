<section id="form">
	<header>
		<span class="title">Faça seu cadastro na Luz Violeta Macrâme</span>
	</header>

	<main>
		<form id="registerForm" [formGroup]="registerForm">
			<div class="mandatory-data">
				<mat-form-field appearance="outline">
					<mat-label>Digite seu nome:</mat-label>
					<input matInput formControlName="name" placeholder="Exemplo da Silva">
				</mat-form-field>

				<mat-form-field appearance="outline">
					<mat-label>Digite seu e-mail:</mat-label>
					<input matInput formControlName="email" placeholder="exemplo@exemplo.com">
				</mat-form-field>

				<mat-form-field appearance="outline">
					<mat-label>Digite sua senha:</mat-label>
					<input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'" placeholder="Ex3mpl@">
					<span class="material-symbols-outlined icon-input" (click)="changeHidePassword($event)" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword()">
						{{ hidePassword() ? 'visibility' : 'visibility_off' }}
					</span>
				</mat-form-field>
			</div>

			<div class="address-data">
				<mat-form-field>
					<mat-label>Digite seu CEP:</mat-label>
					<input matInput formControlName="postalCode" placeholder="13300***">
				</mat-form-field>

				<mat-form-field>
					<mat-label>Estado:</mat-label>
					<mat-select [formControl]="stateControl">
						@for (state of this.states; track state) {
							<mat-option [value]="state" >{{ state }}</mat-option>
						}
					</mat-select>
				</mat-form-field>

				<mat-form-field>
					<mat-label>Cidade:</mat-label>
					<input matInput formControlName="city" placeholder="Cidade Exemplo">
				</mat-form-field>

				<br>

				<mat-form-field class="neighborhood">
					<mat-label>Bairro:</mat-label>
					<input matInput formControlName="neighborhood" placeholder="Bairro Exemplo">
				</mat-form-field>

				
				<mat-form-field class="house-number">
					<mat-label>Número</mat-label>
					<input type="number" matInput formControlName="houseNumber" placeholder="0**">
				</mat-form-field>

				<br>

				<mat-form-field class="street">
					<mat-label>Rua:</mat-label>
					<input matInput formControlName="street" placeholder="Rua Exemplo de Texto">
				</mat-form-field>
			</div>
		</form>
	</main>

	<footer>
		<p>
			<span>Já tenho uma conta:</span>
			<button matButton = "elevated">Fazer Login</button>
		</p>
		
		<button matButton = "elevated" type="submit" form="registerForm">Cadastrar</button>
	</footer>
</section>
