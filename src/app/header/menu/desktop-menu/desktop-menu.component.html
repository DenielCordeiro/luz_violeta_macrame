<nav id="menu-desktop" aria-label="Menu principal">
    <div class="login"><app-login [showRegister]="true"></app-login></div>
    <a mat-button class="default-button item" routerLink="/home" fragment="top" (click)="menuService.closeMenu('noAction')">Início</a>
    <a mat-button class="default-button item" routerLink="/products" (click)="menuService.closeMenu('noAction')">Peças</a>
    <a mat-button class="default-button item" routerLink="/home" fragment="atelier" (click)="menuService.closeMenu('noAction')">O ateliê</a>
    <a mat-button class="default-button item" routerLink="/home" fragment="process" (click)="menuService.closeMenu('noAction')">O processo</a>
    <a mat-button class="default-button item" routerLink="/about" (click)="menuService.closeMenu('noAction')">Nossa história</a>
    <a mat-button class="default-button item" routerLink="/cart" (click)="menuService.closeMenu('noAction')">Carrinho</a>
    @if (administrator) {
        <a mat-button class="default-button item" routerLink="/dashboard" (click)="menuService.closeMenu('noAction')">Dashboard</a>
    }
    @if (authService.profile()) {
        <button mat-button type="button" class="logout item" (click)="modalLogout = !modalLogout">Sair</button>
    }
    @if (modalLogout) {
        <div class="logout-confirmation">
            <p>Deseja sair da sua conta?</p>
            @if (logoutError) {
                <p role="alert">Não foi possível sair agora. Tente novamente.</p>
            }
            <div class="modal-actions">
                <button mat-button type="button" [disabled]="isLoggingOut" (click)="modalLogout = false">Não</button>
                <button mat-flat-button type="button" class="button-logout" [disabled]="isLoggingOut" (click)="isLogout()">Sim, sair</button>
            </div>
        </div>
    }
</nav>
