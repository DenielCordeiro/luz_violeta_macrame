<button #menuToggle mat-icon-button type="button" class="menu-toggle" [class.selected]="menuService.menuOpen()"
    [attr.aria-label]="menuService.menuOpen() ? 'Fechar menu' : 'Abrir menu'"
    [attr.aria-expanded]="menuService.menuOpen()" aria-controls="side-menu" (click)="changeIconBurguer()">
    <span class="menu-icon">
        <span class="line line-one"></span>
        <span class="line line-two"></span>
        <span class="line line-three"></span>
    </span>
</button>

<aside id="side-menu" class="side-menu" [class.menu-open]="menuService.menuOpen()"
    [attr.aria-hidden]="!menuService.menuOpen()" [inert]="!menuService.menuOpen()">
    <app-desktop-menu></app-desktop-menu>
</aside>
