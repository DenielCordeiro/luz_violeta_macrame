<header>
  <h4>{{ product.name }}</h4>
  <span></span>
</header>

<main>
  <img src="{{ product?.file?.url }}" alt="image-product">
</main>

<footer>
  <button matButton="elevated" type="button" class="button-cancel" (click)="this.closeDialog()">Cancelar</button>
  <button matButton="elevated" type="button" class="button-delete" (click)="this.deletingProduct(product?._id)">Excluir</button>
</footer>
