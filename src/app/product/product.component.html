<section id="desktop">
    @for (product of products; track product._id) {
        <div class="card-product">
            <!-- Coluna Esquerda: Imagem e Galeria -->
            <div class="product-gallery">
                <div class="carousel">
                    <img [src]="product?.file?.url" class="product-image" alt="Foto do Produto">
                </div>
            </div>

            <!-- Coluna Direita: Detalhes, Preço, Frete e Ações -->
            <div class="payment">
                <div class="header-payment">
                    <div class="price-product">
                       <span>R$ {{ product?.price }}</span>
                    </div>

                    <div class="icons-edit-or-delete">
                        <button mat-icon-button type="button" class="icon-btn edit" aria-label="Editar produto" (click)="updateModal(product)">
                            <mat-icon class="material-symbols-outlined" aria-hidden="true">edit_square</mat-icon>
                        </button>
                        <button mat-icon-button type="button" class="icon-btn delete" aria-label="Excluir produto" (click)="deleteModal(product?._id)">
                            <mat-icon class="material-symbols-outlined" aria-hidden="true">delete</mat-icon>
                        </button>
                    </div>
                </div>

                <div class="description">
                    <div class="ql-editor" [innerHTML]="product?.description"></div>
                </div>

                <hr class="divider">

                <!-- Cálculo de Frete -->
                <div class="freight">
                    <h4>Calcular Frete</h4>

                    <form [formGroup]="freightForm" class="freight-form">
                        <div class="input-group">
                            <mat-form-field class="input-postalcode" appearance="outline" subscriptSizing="dynamic">
                                <mat-label>CEP</mat-label>
                                <input matInput id="postalCode" type="text" formControlName="postalCode" placeholder="13306-192">
                            </mat-form-field>
                            <button mat-stroked-button type="button" class="button-freight" (click)="searchShipping(this.freightForm.value.postalCode)">
                                <span>Calcular</span>
                                <mat-icon class="material-symbols-outlined" aria-hidden="true">flight</mat-icon>
                            </button>
                        </div>
                    </form>                    

                    @if (this.shippings.length > 0) {
                        <div class="cards-shippings">
                            @for (shipping of shippings; track shipping) {
                                <div class="shipping-item">
                                    <div class="image-shipping">
                                        <img [src]="shipping?.company?.picture" alt="Transportadora">
                                    </div>
                                    <div class="price-shipping">
                                        <span>R$ {{ shipping?.price }}</span>
                                    </div>
                                </div>
                            }
                        </div>
                    }
                </div>

                <hr class="divider">

                <!-- Controle de Quantidade -->
                <div class="products-quantity">
                    <span class="label">Quantidade:</span>
                    <div class="quantity-selector">
                        <button mat-icon-button type="button" class="btn-qty" aria-label="Diminuir quantidade" (click)="changeQuantity('remove')">
                            <mat-icon class="material-symbols-outlined" aria-hidden="true">remove</mat-icon>
                        </button>
                        <span class="quantity">{{ productsQuantity }}</span>
                        <button mat-icon-button type="button" class="btn-qty" aria-label="Aumentar quantidade" (click)="changeQuantity('add')">
                            <mat-icon class="material-symbols-outlined" aria-hidden="true">add</mat-icon>
                        </button>
                    </div>
                </div>

                <!-- Botões de Ação do Carrinho -->
                <div class="add-to-cart">
                    @if (!productAddedToCart) {
                        <button mat-stroked-button type="button" class="btn-action add-btn" (click)="addingToCart()">
                            <span>Adicionar ao Carrinho</span>
                            <mat-icon class="material-symbols-outlined" aria-hidden="true">add_shopping_cart</mat-icon>
                        </button>
                    } @else {
                        <div class="cart-actions-group">
                            <button mat-stroked-button type="button" class="btn-action remove-btn" (click)="removingProductFromCart()">
                                <span>Remover</span>
                                <mat-icon class="material-symbols-outlined" aria-hidden="true">delete</mat-icon>
                            </button>
                            <button mat-stroked-button type="button" class="btn-action go-btn" (click)="goToCart()">
                                <span>Ir para o Carrinho</span>
                                <mat-icon class="material-symbols-outlined" aria-hidden="true">shopping_cart_checkout</mat-icon>
                            </button>
                        </div>
                    }
                </div>
            </div>
        </div>
    }
</section>
